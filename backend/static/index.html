<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physiognomy Analysis System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Physiognomy Analysis</h1>
        <p>Upload a facial image to discover your personal traits.</p>
        
        <div class="upload-section">
            <h3>Option 1: Upload an Image</h3>
            <input type="file" id="imageInput" accept="image/*">
            <button id="analyzeBtn">Analyze Image</button>
        </div>

        <div class="webcam-section" style="margin-top: 20px;">
            <h3>Option 2: Capture from Webcam</h3>
            <video id="webcamVideo" autoplay playsinline style="width: 100%; max-width: 400px; display: none;"></video>
            <canvas id="webcamCanvas" style="display: none;"></canvas>
            <br>
            <button id="startWebcamBtn">Start Webcam</button>
            <button id="captureBtn" style="display: none;">Capture & Analyze</button>
        </div>

        <div id="loading" class="hidden">
            <p>Processing image through the pipeline...</p>
        </div>

        <div id="results" class="hidden">
            <h2>Analysis Results</h2>
            
            <div class="visualization-section">
                <h3>Visualized Marking</h3>
                <img id="visualizedImage" src="" alt="Face Marking" style="max-width: 100%; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
            </div>
            
            <div class="features-section">
                <h3>Extracted Features</h3>
                <ul id="featuresList"></ul>
            </div>
            
            <div class="interpretation-section">
                <h3>Interpretations</h3>
                <ul id="interpretationList"></ul>
            </div>
        </div>
    </div>
    
    <script src="/static/script.js"></script>
</body>
</html>
